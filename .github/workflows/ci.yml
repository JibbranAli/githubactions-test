name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-audit-build:
    name: Test, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every step runs with "set -e" semantics by default, so any failing check stops the pipeline.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Do not leave the GITHUB_TOKEN in the local git config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off

      - name: Build Docker image (not published)
        run: docker build --tag releaseguard:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name releaseguard -p 8000:8000 releaseguard:ci
          trap 'docker rm -f releaseguard >/dev/null' EXIT
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo
              test "$(docker exec releaseguard id -u)" != "0" || { echo "Container runs as root"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy"
          docker logs releaseguard
          exit 1
